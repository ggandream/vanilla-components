<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla Components</title>
    <link rel="stylesheet" href="../../styles.css" />
    <link rel="stylesheet" href="./searchButton.css" />
    <link rel="stylesheet" href="../ActionIcon/actionIcon.css" />
    <link rel="stylesheet" href="../Title/title.css" />

    <script src="../../app.js" type="module"></script>
    <script src="index.js" type="module"></script>
  </head>
  <body>
    <main>
      <site-header class="header"></site-header>
      <div class="container">
        <site-sidebar class="sidebar"></site-sidebar>

        <section class="content">
          <article class="card">
            <dialog id="search__dialog" closedby="any" class="search__dialog">
              <div class="search__entry">
                <span class="search__icon"
                  ><svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-search"
                  >
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
                    <path d="M21 21l-6 -6" /></svg
                ></span>
                <input
                  class="search__input"
                  name="search__input"
                  type="search"
                  placeholder="Search component"
                />
              </div>
              <ul class="search__components">
                <li>
                  <a class="list__link" href="/">Home</a>
                </li>
                <li>
                  <a class="list__link" href="components/Button/">Button</a>
                </li>
                <li>
                  <a class="list__link" href="components/ActionIcon/"
                    >ActionIcon</a
                  >
                </li>
                <li><a class="list__link" href="#">Title</a></li>
              </ul>
            </dialog>
          </article>
        </section>
      </div>
    </main>
  </body>
</html>
